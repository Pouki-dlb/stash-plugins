name: PanicButton!
description: Pause playback, cover the screen and disguise the browser tab with a single key press.
version: 2.1.0
url: https://discourse.stashapp.cc/t/panic-button/12699

ui:
  javascript:
    - PanicButton.js
  css:
    - PanicButton.css

settings:
  01overlayColor:
    displayName: Overlay colour
    description: 'The colour of the screen shown while hidden. Any CSS colour works, for example #000000 or white. Defaults to black.'
    type: STRING
  02overlayImageUrl:
    displayName: Overlay image URL
    description: Show an image instead of a plain colour. Leave blank for a plain colour. The image is scaled to cover the screen, and the overlay colour stays visible behind it while it loads or if it cannot be reached.
    type: STRING

  03disguiseTitle:
    displayName: Tab title while hidden
    description: The text shown in the browser tab while the screen is hidden. Defaults to "New Tab".
    type: STRING
  04disguiseFaviconUrl:
    displayName: Tab icon while hidden
    description: The favicon shown in the browser tab while the screen is hidden. Leave blank for a blank icon, which is the closest match to an empty tab. Accepts any URL your browser can load.
    type: STRING

  05keyBackquote:
    displayName: "Trigger on: ` (backquote)"
    description: 'On a US keyboard, the key left of 1 and above Tab. Ticked for you when the plugin is first installed: it is the best all-round choice, easy to reach, unused by Stash, and it needs no Fn on a Mac. Keys are recognised by their position rather than by the character printed on them, so on a French PC this is the ² key, in that same spot left of 1. Apple is the exception: macOS gives that name to another key on a non-US keyboard, so on a French Mac it is the < > key next to left Shift.'
    type: BOOLEAN
  06keyInsert:
    displayName: "Trigger on: Insert"
    description: Free of conflicts, and far from the keys you use while browsing. Missing from Apple keyboards and from some compact PC keyboards.
    type: BOOLEAN
  08keyPause:
    displayName: "Trigger on: Pause"
    description: Free of conflicts, and hard to press by accident. Missing from Apple keyboards and from most laptops.
    type: BOOLEAN
  09keyScrollLock:
    displayName: "Trigger on: Scroll Lock"
    description: Free of conflicts, and hard to press by accident. Missing from Apple keyboards and from most laptops.
    type: BOOLEAN
  10keyF01:
    displayName: "Trigger on: F1"
    description: Opens the help page in some browsers. Usually blocked successfully, but not guaranteed. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  11keyF02:
    displayName: "Trigger on: F2"
    description: Free of browser conflicts. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  12keyF03:
    displayName: "Trigger on: F3"
    description: Opens the browser find bar, and triggers Mission Control on a Mac. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  13keyF04:
    displayName: "Trigger on: F4"
    description: Free of browser conflicts. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  14keyF05:
    displayName: "Trigger on: F5"
    description: Reloads the page. The plugin blocks it, but a mistake here reveals everything. Not recommended. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  15keyF06:
    displayName: "Trigger on: F6"
    description: Moves focus to the address bar in some browsers. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  16keyF07:
    displayName: "Trigger on: F7"
    description: Toggles caret browsing in Firefox. Free elsewhere. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  17keyF08:
    displayName: "Trigger on: F8"
    description: Free of browser conflicts. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  18keyF09:
    displayName: "Trigger on: F9"
    description: Free of browser conflicts. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN
  19keyF10:
    displayName: "Trigger on: F10"
    description: Opens the menu bar in some browsers. On a Mac, needs Fn unless function keys are set to standard behaviour.
    type: BOOLEAN

  22customTriggerKeys:
    displayName: Additional trigger keys
    description: 'For anything not in the list above, including key combinations. Separate several with commas, for example: ctrl+shift+h, Home. On a Mac use cmd instead of ctrl, for example cmd+shift+h. Escape works here too, but it is no longer recommended: while a video is fullscreen the browser keeps that key for itself, so the first press only leaves fullscreen and a second one is needed to hide the screen. Leave blank if the checkboxes are enough.'
    type: STRING
